name: engineering presentations
on:
  push:
    branches: [main]
    paths: ["engineering-presentations/**", ".github/workflows/engineering-presentations.yml"]
  pull_request:
    branches: [main]
    paths: ["engineering-presentations/**", ".github/workflows/engineering-presentations.yml"]
jobs:
  test:
    name: Publication and browser reload tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s engineering-presentations/tests
      - run: pip install playwright==1.56.0
      - run: playwright install --with-deps chromium
      - run: python engineering-presentations/tests/browser.py

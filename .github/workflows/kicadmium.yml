name: kicadmium

on:
  push:
    branches: [main]
    paths: ["kicadmium/**", ".github/workflows/kicadmium.yml"]
  pull_request:
    branches: [main]
    paths: ["kicadmium/**", ".github/workflows/kicadmium.yml"]

defaults:
  run:
    working-directory: kicadmium

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kicadmium
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build frontend (required for backend embed)
        run: cd frontend && trunk build
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy -p frontend --target wasm32-unknown-unknown --locked
      - run: cargo test --workspace --locked

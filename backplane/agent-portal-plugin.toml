schema_version = 1
name = "backplane"
display_name = "Backplane"
description = "Backplane PCB workbench for KiCad review, checks, fabrication export, BOMs, Gerbers, panelization, and 3D/STEP inspection."
homepage = "https://github.com/i2cjak/Backplane"
license = "MIT"

[compat]
agent_portal = ">=2.14.1525"
platforms = ["linux", "macos"]

[install]
setup = "bin/backplane setup --install-kicad"
doctor = "bin/backplane doctor --json --cwd {cwd}"

[surface]
kind = "http"
default_title = "Backplane"
default_width_percent = 50
health_path = "/healthz"
start = "bin/backplane serve --port {port} --session {session_id} --cwd {cwd}"
ready_url = "http://127.0.0.1:{port}/"

[surface.env]
AGENT_PORTAL_PLUGIN = "backplane"

[[commands]]
name = "doctor"
description = "Report local PCB workflow dependencies and detected project files."
run = "bin/backplane doctor --json --cwd {cwd}"

[[commands]]
name = "drc"
description = "Run design-rule checks for the active board when KiCad tooling is available."
run = "bin/backplane drc --cwd {cwd} --json"

[[commands]]
name = "erc"
description = "Run schematic electrical-rule checks when KiCad tooling is available."
run = "bin/backplane erc --cwd {cwd} --json"

[[commands]]
name = "export-gerbers"
description = "Export fabrication artifacts into the session artifact directory."
run = "bin/backplane export gerbers --cwd {cwd} --out {artifact_dir}"

[[commands]]
name = "export-jlcpcb"
description = "Export a JLCPCB-oriented fabrication package into the session artifact directory."
run = "bin/backplane export jlcpcb --cwd {cwd} --out {artifact_dir}"

[[skills]]
name = "pcb-workflow"
path = "skills/pcb-workflow/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-bom"
path = "skills/kistack/skills/bom/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-export"
path = "skills/kistack/skills/export/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-footprint"
path = "skills/kistack/skills/footprint/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-gerbers"
path = "skills/kistack/skills/gerbers/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-layout"
path = "skills/kistack/skills/layout/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-panelize"
path = "skills/kistack/skills/panelize/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "pcb-product-render"
path = "skills/kistack/skills/pcb-product-render/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-pcb"
path = "skills/kistack/skills/pcb/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-schematic"
path = "skills/kistack/skills/schematic/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-symbol"
path = "skills/kistack/skills/symbol/SKILL.md"
agents = ["claude", "codex"]

[[prompts]]
name = "session"
path = "prompts/session.md"

[[detect]]
name = "kicad"
any = ["*.kicad_pro", "*.kicad_pcb", "*.kicad_sch"]

[[detect]]
name = "gerber-package"
any = ["*.gbr", "*.gtl", "*.gbl", "*.gts", "*.gto", "*.gbs", "*.gbo", "*.drl", "*.zip"]

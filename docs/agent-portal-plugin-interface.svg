<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="title desc">
  <title id="title">Agent Portal plugin interface</title>
  <desc id="desc">Agent Portal discovers plugin manifests, displays suggestions, injects skills, runs commands, and docks plugin HTTP surfaces while plugins own domain tools.</desc>
  <rect width="2000" height="1180" fill="#1a1b26"/>

  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#7aa2f7"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#9ece6a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#e0af68"/>
    </marker>
  </defs>

  <text x="70" y="78" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Agent Portal plugin relationship</text>
  <text x="70" y="126" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="25">Portal stays generic; plugins declare domain capability through a small manifest-driven interface.</text>

  <rect x="70" y="190" width="560" height="760" rx="22" fill="#16161e" stroke="#7aa2f7" stroke-width="4"/>
  <text x="110" y="250" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Agent Portal</text>
  <text x="110" y="292" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">Core app and session runtime</text>

  <rect x="110" y="340" width="480" height="82" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="142" y="374" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Launch menu</text>
  <text x="142" y="405" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">directory-aware plugin suggestions</text>

  <rect x="110" y="455" width="480" height="82" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="142" y="489" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Session header</text>
  <text x="142" y="520" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">plugin chip and dock entry point</text>

  <rect x="110" y="570" width="480" height="82" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="142" y="604" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Agent transcript</text>
  <text x="142" y="635" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">skills, prompts, context-cost notice</text>

  <rect x="110" y="685" width="480" height="82" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="142" y="719" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Command runner</text>
  <text x="142" y="750" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">safe named commands and doctor checks</text>

  <rect x="110" y="800" width="480" height="82" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="142" y="834" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Docked surface host</text>
  <text x="142" y="865" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">local HTTP proxy beside the chat</text>

  <rect x="720" y="190" width="560" height="760" rx="22" fill="#16161e" stroke="#9ece6a" stroke-width="4"/>
  <text x="760" y="250" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Plugin package</text>
  <text x="760" y="292" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">One directory in agent-portal-plugins</text>

  <rect x="760" y="340" width="480" height="92" rx="13" fill="#1e202e" stroke="#9ece6a" stroke-width="2"/>
  <text x="792" y="374" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">agent-portal-plugin.toml</text>
  <text x="792" y="405" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">detect, skills, prompts, commands, surface</text>

  <rect x="760" y="470" width="218" height="112" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="790" y="514" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">skills/</text>
  <text x="790" y="546" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">agent guidance</text>

  <rect x="1022" y="470" width="218" height="112" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1052" y="514" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">prompts/</text>
  <text x="1052" y="546" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">session context</text>

  <rect x="760" y="620" width="218" height="112" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="790" y="664" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">bin/ or target/</text>
  <text x="790" y="696" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">domain CLIs</text>

  <rect x="1022" y="620" width="218" height="112" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1052" y="664" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">HTTP app</text>
  <text x="1052" y="696" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">optional UI</text>

  <rect x="760" y="770" width="480" height="96" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="792" y="807" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Managed toolchains</text>
  <text x="792" y="840" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">KiCad, Verilog, Simulink, or other domain tools</text>

  <rect x="1370" y="190" width="560" height="760" rx="22" fill="#16161e" stroke="#bb9af7" stroke-width="4"/>
  <text x="1410" y="250" fill="#bb9af7" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Working project</text>
  <text x="1410" y="292" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="23">The user's repo and current session</text>

  <rect x="1410" y="340" width="480" height="95" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1442" y="378" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Files on disk</text>
  <text x="1442" y="410" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">*.kicad_pro, *.sv, *.slx, *.mdl, ...</text>

  <rect x="1410" y="485" width="480" height="95" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1442" y="523" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Agent session</text>
  <text x="1442" y="555" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">Claude, Codex, or another supported agent</text>

  <rect x="1410" y="630" width="480" height="95" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1442" y="668" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Artifacts and outputs</text>
  <text x="1442" y="700" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">renders, reports, exports, waveforms, diagrams</text>

  <rect x="1410" y="775" width="480" height="95" rx="13" fill="#1e202e" stroke="#565f89" stroke-width="2"/>
  <text x="1442" y="813" fill="#e6e9f5" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Plugin surface</text>
  <text x="1442" y="845" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="20">domain UI hosted through Portal's proxy</text>

  <rect x="605" y="354" width="140" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="675" y="377" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">scan manifests</text>
  <path d="M630 398 L720 398" fill="none" stroke="#7aa2f7" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="1252" y="354" width="146" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="1325" y="377" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">detect rules</text>
  <path d="M1280 398 L1370 398" fill="none" stroke="#bb9af7" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="1242" y="480" width="166" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="1325" y="503" fill="#9ece6a" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">inject context</text>
  <path d="M1410 532 L1358 532 L1358 526 L1280 526" fill="none" stroke="#9ece6a" stroke-width="5" marker-end="url(#arrow-green)"/>

  <rect x="582" y="732" width="188" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="676" y="755" fill="#e0af68" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">named commands</text>
  <path d="M630 726 L676 726 L676 676 L760 676" fill="none" stroke="#e0af68" stroke-width="5" marker-end="url(#arrow-orange)"/>

  <rect x="1252" y="732" width="146" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="1325" y="755" fill="#e0af68" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">artifacts</text>
  <path d="M1240 676 L1325 676 L1325 676 L1410 676" fill="none" stroke="#e0af68" stroke-width="5" marker-end="url(#arrow-orange)"/>

  <rect x="590" y="884" width="172" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="676" y="907" fill="#7dcfff" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">start surface</text>
  <path d="M630 841 L676 841 L676 940 L1300 940 L1300 676 L1240 676" fill="none" stroke="#7dcfff" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="1244" y="884" width="162" height="34" rx="17" fill="#1a1b26" stroke="#3d4666" stroke-width="1"/>
  <text x="1325" y="907" fill="#7dcfff" font-family="Inter, Arial, sans-serif" font-size="18" text-anchor="middle">dock in Portal</text>
  <path d="M1240 696 L1325 696 L1325 822 L1410 822" fill="none" stroke="#7dcfff" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <rect x="140" y="1000" width="1720" height="95" rx="18" fill="#1e202e" stroke="#3d4666" stroke-width="2"/>
  <text x="180" y="1037" fill="#c0caf5" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Design rule</text>
  <text x="330" y="1037" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="23">Portal provides stable UX and session plumbing; plugins provide domain expertise and tools.</text>
  <text x="330" y="1072" fill="#a9b1d6" font-family="Inter, Arial, sans-serif" font-size="23">The manifest is the contract, so adding a plugin does not require baking its domain into Portal.</text>
</svg>

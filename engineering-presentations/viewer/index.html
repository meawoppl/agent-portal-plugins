<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation review</title><link rel="stylesheet" href="/viewer.css"></head>
<body>
<header>
  <strong id="title">Presentation review</strong>
  <button id="reload" type="button">Reload slides</button>

</header>
<p id="error" role="alert" hidden></p>
<main id="slides" aria-label="Presentation"></main>
<script src="/viewer.js"></script>
</body></html>

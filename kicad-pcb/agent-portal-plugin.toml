schema_version = 1
name = "kicad-pcb"
display_name = "KiCad PCB"
description = "KiCad PCB workbench for KiCad review, checks, fabrication export, BOMs, Gerbers, panelization, and 3D/STEP inspection."
homepage = "https://github.com/i2cjak/Backplane"
license = "MIT"

[compat]
agent_portal = ">=2.14.1525"
platforms = ["linux", "macos"]

[install]
setup = "bin/kicad-pcb setup --install-kicad --install-kicad-tools"
doctor = "bin/kicad-pcb doctor --json --cwd {cwd}"

[surface]
kind = "http"
default_title = "KiCad PCB"
default_width_percent = 50
health_path = "/healthz"
start = "bin/kicad-pcb serve --port {port} --session {session_id} --cwd {cwd}"
ready_url = "http://127.0.0.1:{port}/"

[surface.env]
AGENT_PORTAL_PLUGIN = "kicad-pcb"

[[commands]]
name = "doctor"
description = "Report local PCB workflow dependencies and detected project files."
run = "bin/kicad-pcb doctor --json --cwd {cwd}"

[[commands]]
name = "drc"
description = "Run design-rule checks for the active board when KiCad tooling is available."
run = "bin/kicad-pcb drc --cwd {cwd} --json"

[[commands]]
name = "erc"
description = "Run schematic electrical-rule checks when KiCad tooling is available."
run = "bin/kicad-pcb erc --cwd {cwd} --json"

[[commands]]
name = "export-gerbers"
description = "Export fabrication artifacts into the session artifact directory."
run = "bin/kicad-pcb export gerbers --cwd {cwd} --out {artifact_dir}"

[[commands]]
name = "export-jlcpcb"
description = "Export a JLCPCB-oriented fabrication package into the session artifact directory."
run = "bin/kicad-pcb export jlcpcb --cwd {cwd} --out {artifact_dir}"

[[commands]]
name = "kct"
description = "Run the kicad-tools automation CLI inside the active repo. Pass kct arguments after --."
run = "bin/kicad-pcb kct --json --cwd {cwd} --"

[[commands]]
name = "readiness"
description = "Run kicad-tools manufacturing readiness checks when kct is installed."
run = "bin/kicad-pcb kct --json --cwd {cwd} -- readiness . --format json"

[[commands]]
name = "sync-check"
description = "Analyze schematic-to-PCB drift with kicad-tools when kct is installed."
run = "bin/kicad-pcb kct --json --cwd {cwd} -- sync --analyze ."

[[commands]]
name = "route"
description = "Run kicad-tools routing automation. Agents should pass explicit kct route arguments after --."
run = "bin/kicad-pcb kct --json --cwd {cwd} -- route"

[[skills]]
name = "pcb-workflow"
path = "skills/pcb-workflow/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-tools-automation"
path = "skills/kicad-tools-automation/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-bom"
path = "skills/kistack/skills/bom/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-export"
path = "skills/kistack/skills/export/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-footprint"
path = "skills/kistack/skills/footprint/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "kicad-gerbers"
path = "skills/kistack/skills/gerbers/SKILL.md"
agents = ["claude", "codex"]

[[skills]]

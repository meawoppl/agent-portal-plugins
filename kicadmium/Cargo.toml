[workspace]
members = [
    "backend",
    "frontend",
    "kct",
    "shared",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
mime_guess = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["trace", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Everything from pastebom.com comes from the single `eda-view` crate at ONE
# revision, so `eda_view::vector::Scene` is a single type across the backend
# and the wasm frontend. Each crate enables only the features it uses: the
# frontend must never link the parsers or the glyph tables.
eda-view = { git = "https://github.com/meawoppl/pastebom.com", rev = "a6749f30e2c94e2128b37c9ef222b2ee0608aae2" }

# Release profile for the wasm frontend only (frontend/index.html selects it
# with data-cargo-profile-release). Whole-program LTO at the normal opt-level
# lets the optimiser drop the many per-closure Yew monomorphisations that
# eda-view's components and Yew 0.23 add; the backend keeps the default release
# profile and its build time.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1

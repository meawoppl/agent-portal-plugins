[workspace]
members = [
    "backend",
    "frontend",
    "kct",
    "kicad-strokes",
    "shared",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
mime_guess = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["trace", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Every pastebom crate comes from ONE revision so `vector_view::Scene` (and its
# re-exports through schematic-extract / vector-view-yew / gerber-view) is a
# single type across the backend and the wasm frontend.
vector-view = { git = "https://github.com/meawoppl/pastebom.com", rev = "22eacc717a863d2a96cd4e101671a97b749edb47" }
vector-view-yew = { git = "https://github.com/meawoppl/pastebom.com", rev = "22eacc717a863d2a96cd4e101671a97b749edb47" }
schematic-extract = { git = "https://github.com/meawoppl/pastebom.com", rev = "22eacc717a863d2a96cd4e101671a97b749edb47" }
kicad-strokes = { git = "https://github.com/meawoppl/pastebom.com", rev = "22eacc717a863d2a96cd4e101671a97b749edb47" }
gerber-view = { git = "https://github.com/meawoppl/pastebom.com", rev = "22eacc717a863d2a96cd4e101671a97b749edb47" }

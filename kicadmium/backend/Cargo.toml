[package]
name = "backend"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "kicadmium"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
csv = "1"
futures.workspace = true
mime_guess.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
zip.workspace = true

# Pre-compressed static frontend assets (brotli/gzip, ETag/304, SPA fallback).
# memory-serve 0.6.x is the axum-0.7 compatible line (2.x requires axum 0.8+).
memory-serve = "0.6"
# Pin alloc-stdlib: 0.2.3 bumped its alloc-no-stdlib dep to 3.0, which clashes
# with brotli-decompressor 4.0.3 (still on alloc-no-stdlib 2.x) inside
# memory-serve's brotli 6. Holding 0.2.2 keeps the graph on one version.
alloc-stdlib = "=0.2.2"

shared = { path = "../shared" }
pcb-lint = { path = "../pcb-lint" }
kct = { path = "../kct" }
kicad-strokes = { path = "../kicad-strokes" }
vector-view.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

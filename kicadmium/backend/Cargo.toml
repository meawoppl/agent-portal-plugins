[package]
name = "backend"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "kicadmium"
path = "src/main.rs"

[dependencies]
libc = "0.2"
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
csv = "1"
futures.workspace = true
mime_guess.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
zip.workspace = true

# brotli pre-compresses frontend/dist in build.rs. Pin alloc-stdlib: 0.2.3
# bumped its alloc-no-stdlib dep to 3.0, which clashes with brotli-decompressor
# 4.0.3 (still on alloc-no-stdlib 2.x) inside brotli 6.
alloc-stdlib = "=0.2.2"

shared = { path = "../shared" }
kct = { path = "../kct" }
kicad-strokes = { path = "../kicad-strokes" }
vector-view.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
brotli = "6"
mime_guess.workspace = true

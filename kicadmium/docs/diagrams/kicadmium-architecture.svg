<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2000" viewBox="0 0 1800 2000">
<defs><style>
text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#c0caf5}.title{font-size:34px;font-weight:700}.sub{font-size:15px;fill:#9aa5ce}.h{font-size:17px;font-weight:700}.sh{font-size:13px;font-weight:700}.b{font-size:12px}.s{font-size:11px;fill:#9aa5ce}.m{font-family:"JetBrains Mono",Menlo,monospace;font-size:11px}.box{fill:#1f2335;stroke-width:2}.in{fill:#16161e;stroke-width:1}.ln{fill:none;stroke-width:2;marker-end:url(#a)}
</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect width="1800" height="2000" fill="#1a1b26"/>
<text x="40" y="50" class="title">kicadmium — complete system architecture</text>
<text x="40" y="78" class="sub">The heavy metal your PCBs were missing · Agent Portal-native · one Rust binary · backend-reified geometry · minimal 2D/3D viewers</text>

<!-- External and entry surfaces -->
<rect x="40" y="110" width="330" height="190" rx="10" class="box" stroke="#bb9af7"/><text x="56" y="138" class="h" fill="#bb9af7">Agent Portal plugin</text>
<text x="56" y="164" class="b">agent-portal-plugin.toml</text><text x="56" y="184" class="b">• HTTP surface: serve --port --session --cwd</text><text x="56" y="204" class="b">• 10 commands · 12 skills · session prompt</text><text x="56" y="224" class="b">• detect KiCad projects and Gerber packages</text><text x="56" y="244" class="b">• edit-stack: annotations + lint review queue</text><text x="56" y="264" class="b">• enabled kicadmium replaces disabled legacy kicad-pcb</text><text x="56" y="286" class="s">No MCP adapter: agents use shell commands directly.</text>
<rect x="390" y="110" width="330" height="190" rx="10" class="box" stroke="#9ece6a"/><text x="406" y="138" class="h" fill="#9ece6a">bp-test / hardware repository</text>
<text x="406" y="164" class="b">Agent works in the board repo; plugin gets --cwd.</text><text x="406" y="184" class="b">*.kicad_pro · *.kicad_sch · *.kicad_pcb</text><text x="406" y="204" class="b">library tables · models · Gerbers · fab outputs</text><text x="406" y="224" class="b">.kicad-pcb.json: projects/build/lint/libraries</text><text x="406" y="244" class="b">validated discovery: 6 bp-test projects</text><text x="406" y="264" class="b">inspect → queue → edit → rerun gates</text><text x="406" y="286" class="s">Repository-independent; bp-test is the proven fixture.</text>
<rect x="740" y="110" width="330" height="190" rx="10" class="box" stroke="#7dcfff"/><text x="756" y="138" class="h" fill="#7dcfff">Humans + coding agents</text>
<text x="756" y="164" class="b">Browser: review/build workbench</text><text x="756" y="184" class="b">kicadmium quality|lint|drc|erc|export</text><text x="756" y="204" class="b">kicadmium kct -- &lt;command&gt;</text><text x="756" y="224" class="b">kicadmium pcb-lint -- &lt;command&gt;</text><text x="756" y="244" class="b">desktop/touch views, layers, nets, annotations</text><text x="756" y="264" class="b">live revision/build events refresh all tabs</text>
<rect x="1090" y="110" width="310" height="190" rx="10" class="box" stroke="#e0af68"/><text x="1106" y="138" class="h" fill="#e0af68">External KiCad boundary</text>
<text x="1106" y="164" class="b">Discovered; never bundled or downloaded.</text><text x="1106" y="184" class="b">KICADMIUM_KICAD_CLI → PATH</text><text x="1106" y="204" class="b">ERC/DRC · zone refill · Gerbers · drill</text><text x="1106" y="224" class="b">BOM/CPL · PDF · board/library GLB · STEP</text><text x="1106" y="244" class="b">Only approved external subprocess.</text><text x="1106" y="264" class="s">No KiCad, OCCT, or STEP CAD runtime in browser.</text>
<rect x="1420" y="110" width="340" height="190" rx="10" class="box" stroke="#565f89"/><text x="1436" y="138" class="h" fill="#9aa5ce">Lineage / shared projects</text>
<text x="1436" y="164" class="b">rjwalters/kicad-tools → kct</text><text x="1436" y="184" class="b">i2cjak/Backplane → conventions</text><text x="1436" y="204" class="b">American-Embedded/kistack → skills</text><text x="1436" y="224" class="b">meawoppl/pastebom → vector/gerber view</text><text x="1436" y="244" class="b">Newstroke 2015 CC0 → kicad-strokes</text><text x="1436" y="264" class="b">Three.js → sole retained JS runtime</text>

<!-- Binary -->
<rect x="40" y="350" width="1720" height="680" rx="12" class="box" stroke="#7aa2f7"/><text x="58" y="382" class="h" fill="#7aa2f7">One distributable: target/release/kicadmium</text><text x="1742" y="382" text-anchor="end" class="s">clap + tokio + Axum + memory-serve</text>
<rect x="60" y="405" width="310" height="300" rx="8" class="in" stroke="#7aa2f7"/><text x="76" y="432" class="sh" fill="#7aa2f7">CLI / automation</text>
<text x="76" y="458" class="m">setup / doctor / serve</text><text x="76" y="478" class="m">drc / erc / quality / lint</text><text x="76" y="498" class="m">pcb-lint -- &lt;full CLI&gt;</text><text x="76" y="518" class="m">export gerbers|jlcpcb</text><text x="76" y="538" class="m">kct -- &lt;67 native commands&gt;</text><text x="76" y="558" class="m">tool -- kicad-cli &lt;args&gt;</text><text x="76" y="588" class="b">Mutations need -o, --in-place, or --dry-run.</text><text x="76" y="608" class="b">Routing preserves copper; DRC regression rolls back.</text><text x="76" y="628" class="b">JSON receipts make automation observable.</text><text x="76" y="660" class="s">No Python, venv, KiKit, pygerber, shell wrapper,</text><text x="76" y="678" class="s">MCP server, or native C viewer dependency.</text>
<rect x="390" y="405" width="400" height="460" rx="8" class="in" stroke="#7dcfff"/><text x="406" y="432" class="sh" fill="#7dcfff">Axum HTTP / live API</text>
<text x="406" y="456" class="m">/healthz · /api/projects · manifest</text><text x="406" y="476" class="m">revision · sources · /ws/events</text><text x="406" y="506" class="sh" fill="#9ece6a">Backend-reified views</text><text x="406" y="528" class="m">/api/kicad/schematic → Scene</text><text x="406" y="548" class="m">/api/kicad/pcbscene → Scene</text><text x="406" y="568" class="m">/api/kicad/library/scene/:file → Scene</text><text x="406" y="588" class="m">/api/kicad/gerbers + /file</text><text x="406" y="608" class="m">/api/kicad/model.glb</text><text x="406" y="638" class="sh" fill="#f7768e">Checks / work / build</text><text x="406" y="660" class="m">drc · erc · quality · lint · contact-sheet</text><text x="406" y="680" class="m">bom · library/* · build/status/events</text><text x="406" y="700" class="m">build/run · publish · artifact</text><text x="406" y="734" class="b">Portal-owned POST /__portal/edit-stack:</text><text x="406" y="754" class="b">annotations + evidence-bound lint cards enqueue work.</text><text x="406" y="786" class="s">GET / serves the embedded Yew application.</text>
<rect x="810" y="405" width="460" height="460" rx="8" class="in" stroke="#9ece6a"/><text x="826" y="432" class="sh" fill="#9ece6a">Backend: parse once, reify geometry</text>
<text x="826" y="458" class="b">kct::schema::{pcb, schematic, symbol, library}</text><text x="826" y="486" class="b">├─ pcb_scene.rs → vector_view::Scene</text><text x="826" y="506" class="b">├─ schematic_view.rs → vector_view::Scene</text><text x="826" y="526" class="b">└─ library_scene.rs → footprint/symbol Scene</text><text x="826" y="556" class="b">kicad-strokes: pinned CC0 Newstroke → Prim::Strokes</text><text x="826" y="584" class="b">Scene: layers · items · primitives · nets · groups</text><text x="826" y="604" class="b">metadata · bbox · stable pick IDs</text><text x="826" y="634" class="b">jobs: ERC · DRC · BOM · PDF · Gerbers · JLCPCB</text><text x="826" y="654" class="b">GLB · STEP artifact · quality · cache · SSE</text><text x="826" y="684" class="b">library/thumbnails: inventory + LRU render cache</text><text x="826" y="704" class="b">revision/watch: hashes + filesystem events</text><text x="826" y="724" class="b">artifacts: publish manifest + staleness</text><text x="826" y="744" class="b">profile/audits: project quality policy</text><text x="826" y="780" class="s">Geometry—not KiCad syntax—is the browser contract.</text><text x="826" y="800" class="s">Gerber stays on gerber-view pending a Scene adapter.</text>
<rect x="1290" y="405" width="450" height="460" rx="8" class="in" stroke="#bb9af7"/><text x="1306" y="432" class="sh" fill="#bb9af7">Embedded Rust/WASM workbench</text>
<text x="1306" y="458" class="b">Yew shell · project picker · live health · build strip</text><text x="1306" y="478" class="b">typed API · persisted tab/view state · touch input</text><text x="1306" y="508" class="sh" fill="#7dcfff">One generic 2D scene host</text><text x="1306" y="530" class="b">vector_scene.rs + pastebom vector-view</text><text x="1306" y="550" class="b">Canvas draw · hit-test · pan/zoom/pinch · layers</text><text x="1306" y="570" class="b">passes · grid · selection · net/group highlight</text><text x="1306" y="590" class="b">Schematic · PCB · symbol · footprint share Scene</text><text x="1306" y="620" class="sh" fill="#e0af68">Minimal 3D host</text><text x="1306" y="642" class="b">Rust/web-sys bridge: backend GLB → Three.js</text><text x="1306" y="662" class="b">GLTFLoader + OrbitControls</text><text x="1306" y="692" class="sh" fill="#9ece6a">Other tabs</text><text x="1306" y="714" class="b">Gerbers · BOM · Libraries · Analysis · Panelization</text><text x="1306" y="734" class="b">Checks · annotation region composer</text><text x="1306" y="764" class="sh" fill="#f7768e">Exactly four retained JavaScript files</text><text x="1306" y="786" class="b">three.module · GLTFLoader · OrbitControls</text><text x="1306" y="806" class="b">BufferGeometryUtils · 52,947 lines</text><text x="1306" y="832" class="s">KiCanvas, OCCT, workers, glyph JS, adapters: removed.</text>
<rect x="60" y="890" width="1680" height="110" rx="8" class="in" stroke="#565f89"/><text x="76" y="918" class="sh" fill="#9aa5ce">Build/embed pipeline</text><text x="76" y="944" class="b">Yew + shared types + vector-view(canvas) → trunk/wasm-bindgen → frontend/dist → memory-serve compile-time embedding</text><text x="76" y="966" class="b">backend/build.rs rebuilds stale frontend inputs in target/frontend; cargo build --release -p backend produces the single self-contained binary.</text><text x="76" y="988" class="s">Runtime inputs: hardware repository + external kicad-cli. No separate web server, package runtime, or asset CDN.</text>

<!-- Native engines -->
<rect x="40" y="1070" width="1050" height="600" rx="12" class="box" stroke="#9ece6a"/><text x="58" y="1102" class="h" fill="#9ece6a">kct — native Rust port of rjwalters/kicad-tools</text><text x="1072" y="1102" text-anchor="end" class="s">library + kicadmium kct -- …</text>
<rect x="60" y="1125" width="330" height="510" rx="8" class="in" stroke="#9ece6a"/><text x="76" y="1152" class="sh" fill="#9ece6a">Foundations and engines</text><text x="76" y="1178" class="b">sexp: lossless parse/edit/serialize</text><text x="76" y="1198" class="b">schema: PCB · schematic · symbol · library</text><text x="76" y="1218" class="b">hierarchy · instances · labels · wires · BOM</text><text x="76" y="1238" class="b">core: layers · geometry · outline · netclass</text><text x="76" y="1258" class="b">units · config · transaction · project · fsutil</text><text x="76" y="1288" class="b">validate: native DRC + spatial rule families</text><text x="76" y="1308" class="b">router: negotiated A* · rip-up/reroute · planes</text><text x="76" y="1328" class="b">via fan-out · fine grid · DRC rollback guard</text><text x="76" y="1348" class="b">drc/erc: reports · waivers · prediction · repair</text><text x="76" y="1368" class="b">physics: impedance · coupling · timing · ampacity</text><text x="76" y="1388" class="b">manufacturer profiles + DRU generation</text><text x="76" y="1408" class="b">zones · stitch · creepage · placement · recovery</text><text x="76" y="1428" class="b">analysis · sync · parts · silkscreen · IPC</text><text x="76" y="1462" class="s">Upstream flags/defaults/JSON retained where useful.</text><text x="76" y="1480" class="s">Divergences and ignored flags are explicit.</text>
<rect x="410" y="1125" width="660" height="510" rx="8" class="in" stroke="#9ece6a"/><text x="426" y="1152" class="sh" fill="#9ece6a">67 registered commands — all native</text><text x="426" y="1180" class="sh" fill="#7dcfff">Checks</text><text x="426" y="1200" class="b">check · drc · erc · explain · detect-mistakes</text><text x="426" y="1228" class="sh" fill="#7dcfff">Schematic/netlist</text><text x="426" y="1248" class="b">symbols · nets · netlist · sch · bom · lib · validate · sync</text><text x="426" y="1276" class="sh" fill="#7dcfff">Board analysis</text><text x="426" y="1296" class="b">pcb · analyze · net-status · board-metrics · audit · readiness</text><text x="426" y="1316" class="b">report · estimate · fleet · render · screenshot</text><text x="426" y="1344" class="sh" fill="#7dcfff">Repair/optimize</text><text x="426" y="1364" class="b">optimize-traces · validate/fix-footprints · fix-vias · fix-silkscreen</text><text x="426" y="1384" class="b">place-silk-refs · repair-clearance · fix-drc · fix-erc</text><text x="426" y="1412" class="sh" fill="#7dcfff">Copper/SI/routing</text><text x="426" y="1432" class="b">zones · stitch · creepage · impedance · constraints · placement</text><text x="426" y="1452" class="b">optimize-placement · decisions · optim · route · route-auto</text><text x="426" y="1472" class="b">benchmark · bench · calibrate</text><text x="426" y="1500" class="sh" fill="#7dcfff">Fabrication/project/automation</text><text x="426" y="1520" class="b">parts · datasheet · suggest · mfr · init · footprint · panel · export</text><text x="426" y="1540" class="b">create-pcb · build · spec · pipeline · config · doctor · clean</text><text x="426" y="1560" class="b">ipc · reason · interactive · run</text><text x="426" y="1592" class="s">No Python at install, test, or runtime.</text>

<rect x="1120" y="1070" width="640" height="285" rx="12" class="box" stroke="#f7768e"/><text x="1138" y="1102" class="h" fill="#f7768e">pcb-lint — evidence-aware advisory review</text><text x="1138" y="1130" class="b">101 heuristics: copper · routing · placement · intent · manufacturing</text><text x="1138" y="1150" class="b">stable subject finding keys + evidence hashes + invalidating review ledger</text><text x="1138" y="1170" class="b">JSON + self-contained paginated HTML/SVG contact sheets</text><text x="1138" y="1190" class="b">cards: board crop · subjects · explanation · evidence · suggested action</text><text x="1138" y="1210" class="b">explicit Enqueue for review → Portal edit-stack</text><text x="1138" y="1230" class="b">item: project/revision · rule · UUIDs · crop · key · evidence hash</text><text x="1138" y="1250" class="b">advisory candidate ≠ authorized repair; rerun checks after edits</text><text x="1138" y="1282" class="s">Not native DRC; cached-fill and unsupported geometry stay explicit.</text>
<rect x="1120" y="1380" width="640" height="290" rx="12" class="box" stroke="#bb9af7"/><text x="1138" y="1412" class="h" fill="#bb9af7">Skills + bp-test execution loop</text><text x="1138" y="1440" class="b">pcb-workflow · kicad-tools-automation</text><text x="1138" y="1460" class="b">kistack: BOM · export · footprint · gerbers · layout · panelize</text><text x="1138" y="1480" class="b">PCB · schematic · symbol · product render</text><text x="1138" y="1512" class="b">1. Portal detects bp-test and launches kicadmium in its cwd.</text><text x="1138" y="1532" class="b">2. Agent reads skills; shell commands inspect/build/check.</text><text x="1138" y="1552" class="b">3. Workbench exposes views, evidence, artifacts, live status.</text><text x="1138" y="1572" class="b">4. Human/agent queues focused work; edits remain explicit.</text><text x="1138" y="1592" class="b">5. kct + pcb-lint + KiCad native gates verify revision.</text><text x="1138" y="1622" class="s">Old EE plugin reduces to interaction/queue plumbing.</text>

<!-- Footer boxes -->
<rect x="40" y="1710" width="560" height="220" rx="10" class="box" stroke="#7dcfff"/><text x="56" y="1740" class="h" fill="#7dcfff">pastebom vector-view relationship</text><text x="56" y="1768" class="b">Generic Rust Scene + Canvas renderer + hit/view/input math</text><text x="56" y="1788" class="b">passes · visibility · hidden items · grid · overlays</text><text x="56" y="1808" class="b">kicadmium pins the crate and supplies KiCad reifiers.</text><text x="56" y="1828" class="b">pastebom supplies its PcbData → Scene adapter.</text><text x="56" y="1856" class="s">One reusable contract; no copied viewer fork.</text><text x="56" y="1876" class="s">Gerber → Scene is the remaining unification opportunity.</text>
<rect x="620" y="1710" width="560" height="220" rx="10" class="box" stroke="#9ece6a"/><text x="636" y="1740" class="h" fill="#9ece6a">Repository support surface</text><text x="636" y="1768" class="b">shared/: serde API/event/library types</text><text x="636" y="1788" class="b">skills/ + prompts/: Portal-visible agent playbooks</text><text x="636" y="1808" class="b">docs/: principles · provenance · JS retirement · third-party</text><text x="636" y="1828" class="b">examples/: PCB profile + Portal plugin config</text><text x="636" y="1856" class="s">Workspace: backend · frontend · shared · kct</text><text x="636" y="1876" class="s">kicad-strokes · pcb-lint</text>
<rect x="1200" y="1710" width="560" height="220" rx="10" class="box" stroke="#e0af68"/><text x="1216" y="1740" class="h" fill="#e0af68">Honest boundaries / remaining work</text><text x="1216" y="1768" class="b">Gerbers use gerber-view, not generic Scene yet.</text><text x="1216" y="1788" class="b">STEP is downloadable; browser 3D consumes GLB.</text><text x="1216" y="1808" class="b">Experimental diff-pair work is not on main.</text><text x="1216" y="1828" class="b">Router escape/length-match strategies remain incomplete.</text><text x="1216" y="1848" class="b">Some dimensions/text boxes/mask expansion are not drawn.</text><text x="1216" y="1876" class="s">Unknown geometry and heuristic uncertainty stay visible.</text>


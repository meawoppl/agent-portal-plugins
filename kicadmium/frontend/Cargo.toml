[package]
name = "frontend"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "CustomEvent", "CustomEventInit", "DomRect", "Element", "EventTarget", "HtmlCanvasElement", "HtmlIFrameElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "Document", "NodeList", "Node", "KeyboardEvent", "Location", "MediaQueryList", "MessageEvent", "MouseEvent", "Navigator", "PointerEvent", "ResizeObserver", "Storage", "UrlSearchParams", "VisualViewport", "WheelEvent", "Window"] }
js-sys = "0.3"
gloo-events = "0.2"
gloo-timers = "0.3"
gloo-utils = "0.2"
gloo-net = "0.6"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
shared = { path = "../shared" }
# UI features only (`yew` implies `canvas`): no kicad/strokes/schematic
# parser code may reach the wasm bundle. `gerber-view` brings `pcb` with it,
# as the separate gerber-view crate always did.
eda-view = { workspace = true, features = ["yew", "gerber-view"] }

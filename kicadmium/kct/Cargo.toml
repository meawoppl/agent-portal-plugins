[package]
name = "kct"
edition.workspace = true
license = "MIT"
version = "0.22.0"
description = "Rust port of rjwalters/kicad-tools (kct): KiCad automation for agents"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
pdf-extract = "0.10"
regex = "1"

[dev-dependencies]
tempfile.workspace = true

[package]
name = "kct"
edition.workspace = true
license = "MIT"
version = "0.22.0"
description = "Rust port of rjwalters/kicad-tools (kct): KiCad automation for agents"

[dependencies]
anyhow.workspace = true
clap.workspace = true
regex = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
toml = { version = "0.9", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
pdf-extract = "0.10"
sha2 = "0.10"
geo = "0.32"
i_overlay = "4.0"
zip.workspace = true
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4", "v5"] }
resvg = "0.45"
rustyline = { version = "17", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true

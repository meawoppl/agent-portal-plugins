[package]
name = "pcb-lint"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only, review-aware KiCad layout heuristics"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
geo = "0.32"
petgraph = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

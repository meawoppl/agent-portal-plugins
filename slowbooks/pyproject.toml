[project]
name = "portal-slowbooks"
version = "0.1.0"
description = "Agent Portal launcher and API tools for SlowBooks Pro"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.12,<4",
  "fastapi>=0.135.0,<0.142",
  "uvicorn[standard]>=0.32.0,<1.0",
  "starlette>=1.0.1,<2.0",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.16.0,<2.0",
  "sqlcipher3>=0.6.3,<0.7",
  "psycopg2-binary==2.9.12",
  "pydantic>=2.11.0,<3.0",
  "pydantic-settings>=2.10.0,<3.0",
  "python-dotenv==1.2.2",
  "jinja2==3.1.6",
  "weasyprint==70.0",
  "pydyf==0.12.1",
  "python-multipart==0.0.32",
  "ofxparse>=0.21,<1.0",
  "python-dateutil>=2.9.0,<3.0",
  "stripe>=8.0.0,<16.0",
  "cryptography>=48.0.1,<51.0",
  "httpx>=0.27.0,<1.0",
  "argon2-cffi>=23.1.0,<26.0",
  "itsdangerous>=2.1.0,<3.0",
  "slowapi>=0.1.9,<1.0",
  "openpyxl>=3.1,<3.2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

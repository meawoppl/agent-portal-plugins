schema_version = 1
name = "verilog"
display_name = "Verilog"
description = "Icarus testbench runs, retained waveforms, and engineering review."
license = "MIT"

[install]
setup = "bin/verilog setup"
doctor = "bin/verilog doctor --cwd {cwd}"

[surface]
kind = "http"
default_title = "Verilog"
default_width_percent = 65
health_path = "/healthz"
start = "bin/verilog serve --port {port} --session {session_id} --cwd {cwd}"

[[commands]]
name = "test"
description = "Run discovered testbenches; select one with --test ID."
run = "bin/verilog test --cwd {cwd}"

[[commands]]
name = "doctor"
run = "bin/verilog doctor --cwd {cwd}"

[[commands]]
name = "tool"
description = "Forward arguments after -- to an HDL tool."
run = "bin/verilog tool --cwd {cwd} --"

[[toolchains]]
name = "simulation"
description = "Icarus/vvp from PATH; locked Python parser/server environment."
doctor = "bin/verilog doctor --cwd {cwd}"
install = "bin/verilog setup"

[[skills]]
name = "verilog-workflow"
path = "skills/verilog-workflow/SKILL.md"
agents = ["claude", "codex"]

[[skills]]
name = "waveform-review"
path = "skills/waveform-review/SKILL.md"
agents = ["claude", "codex"]

[[detect]]
name = "hdl"
any = ["*.v", "*.sv", ".verilog-workbench.json"]

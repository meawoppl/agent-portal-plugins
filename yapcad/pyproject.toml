[project]
name = "portal-yapcad"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.13.3",
  "watchfiles==1.1.1",
  "pillow==11.3.0",
  "scipy",
  "yapcad[manifold,meshcheck]",
]

[tool.uv.sources]
# Pin the tested upstream contribution for retained booleans/runtime fixes.
# Switch back to rdevaul/yapCAD after the contribution merges.
yapcad = { git = "https://github.com/meawoppl/yapCAD", rev = "5985e31dcefcaad2f63818ed22bda7db0fde9ea0" }

[dependency-groups]
dev = ["playwright==1.55.0"]
